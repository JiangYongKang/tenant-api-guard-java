# ===== 多租户接口保护配置（本地可调整） =====
# 配额时间窗口长度（毫秒）
tenant.guard.window-ms=1000
# 默认每窗口配额（未单独配置的租户）；<=0 表示默认拒绝
tenant.guard.default-quota=10
# 默认配额口径：FIXED=按固定时间段切分（历史口径，默认）；SLIDING=任意连续 window-ms 内不超配额
tenant.guard.default-quota-mode=FIXED
# 幂等记录存活时间（毫秒），过期后同一键视为首次提交
tenant.guard.idempotency-ttl-ms=300000
# 默认每租户并发槽上限；<=0 表示默认拒绝
tenant.guard.default-max-concurrent=20
# 全局并发信号量上限（本地资源紧张时的最终降级阈值）
tenant.guard.global-max-concurrent=1024
# 首次请求执行中时重复请求的等待上限（毫秒）
tenant.guard.in-progress-timeout-ms=10000
# 配额运行时状态空闲回收阈值（毫秒）：超过该时长无请求的租户状态可被后台回收；<=0 表示不回收
tenant.guard.quota-idle-evict-ms=1800000
# 空闲状态后台扫描间隔（毫秒）
tenant.guard.quota-evict-interval-ms=300000

# 按租户配置（示例）
tenant.guard.tenants.t1.quota=5
tenant.guard.tenants.t1.max-concurrent=3
# t1 不配置 quota-mode，沿用默认 FIXED，老租户行为不变
tenant.guard.tenants.t2.quota=100
tenant.guard.tenants.t2.max-concurrent=10
# t3 选择更平滑的滑动窗口口径：任意连续 1000ms 内最多 5 个，交界处不再两段叠加
tenant.guard.tenants.t3.quota=5
tenant.guard.tenants.t3.quota-mode=SLIDING
tenant.guard.tenants.t3.max-concurrent=10
