# ============================================================
# 多租户接口保护配置 (tenant.guard)
# ============================================================

# ---- 配额:按租户的滑动窗口限流 ----
# 默认每租户每个窗口允许的请求数
tenant.guard.quota.default-limit=100
# 窗口长度(毫秒)
tenant.guard.quota.window-millis=60000
# 每个窗口切分的子桶数量,越大限流越平滑(桶长 = window-millis / buckets-per-window)
tenant.guard.quota.buckets-per-window=6
# 按租户覆盖配额
tenant.guard.quota.tenant-limits.premium-a=500
tenant.guard.quota.tenant-limits.basic-b=20

# ---- 写操作幂等 ----
# 幂等记录保留时长(毫秒),默认 24h
tenant.guard.idempotency.ttl-millis=86400000
# 同一标识并发重复请求等待首次完成的上限(毫秒)
tenant.guard.idempotency.inflight-timeout-millis=5000
# 本地幂等记录硬上限
tenant.guard.idempotency.max-records=100000
# 分段锁数量
tenant.guard.idempotency.lock-stripes=64
# 过期记录定时清理周期(毫秒),<=0 关闭
tenant.guard.idempotency.purge-interval-millis=60000

# ---- 并发隔离舱 ----
# 全局最大在处理并发
tenant.guard.bulkhead.global-max-concurrent=1000
# 单租户默认最大并发
tenant.guard.bulkhead.default-tenant-max-concurrent=100
# 按租户覆盖
tenant.guard.bulkhead.tenant-max-concurrent.basic-b=5
# 信号量公平性
tenant.guard.bulkhead.fair=true

# ---- 服务 ----
server.port=8080
logging.level.com.github.highcumontoa=INFO
